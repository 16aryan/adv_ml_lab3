[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "lab3"
version = "0.0.1"
description = "lab3 adml"
authors = [
  { name = "aryan goel" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "loguru",
    "mkdocs",
    "pip",
    "python-dotenv",
    "ruff",
    "tqdm",
    "typer",
]
requires-python = "~=3.,12.0"


[tool.ruff]
line-length = 99
src = ["lab3"]
include = ["pyproject.toml", "lab3/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["lab3"]
force-sort-within-sections = true

